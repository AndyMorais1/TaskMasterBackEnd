name: taskmaster
services:
  postgres:
    image: postgres:15
    container_name: taskmaster-db
    env_file:
      - .env
    ports:
      - "5439:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  app:
    build: .
    container_name: taskmaster-app
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - postgres
    restart: always

volumes:
  postgres_data: